name: Deploy

"on":
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: carl
          key: ${{ secrets.SSH_KEY }}
          script: /usr/local/bin/deploy.sh
