<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marketingland 3D</title>
  <meta name="description" content="A browsable 3D world of Marketingland: Diagnosis, Strategy and Execution." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="loader">
    <div class="loader-title">MARKETINGLAND</div>
    <div class="loader-sub">Building the island…</div>
  </div>

  <header id="topbar">
    <h1>MARKETINGLAND</h1>
    <nav>
      <button id="btn-overview" title="Back to the full map">Overview</button>
      <button id="btn-tour" class="primary" title="Visit every stop in the proper order">▶ Proper route tour</button>
      <button id="btn-drive" title="Drive the road from start to beach">🚗 Drive the road</button>
    </nav>
  </header>

  <aside id="legend">
    <button id="legend-toggle" aria-expanded="true">Map stops</button>
    <div id="legend-body"></div>
  </aside>

  <section id="info" hidden>
    <button id="info-close" aria-label="Close">×</button>
    <div id="info-phase"></div>
    <h2 id="info-title"></h2>
    <p id="info-desc"></p>
    <ul id="info-points"></ul>
    <div id="info-nav">
      <button id="info-prev">← Prev</button>
      <span id="info-count"></span>
      <button id="info-next">Next →</button>
    </div>
  </section>

  <div id="drive-hud" hidden>
    <div id="drive-now">Starting at Market Orientation</div>
    <div class="drive-buttons">
      <button id="drive-pause">Pause</button>
      <button id="drive-speed">Speed ×1</button>
      <button id="drive-exit">Exit</button>
    </div>
  </div>

  <div id="tooltip" hidden></div>
  <div id="hint">Drag to rotate · Right-drag to pan · Scroll to zoom · Click a numbered pin</div>
  <footer id="credit">Based on the Marketingland concept by The Proper Marketing Club (2019).</footer>

  <script type="module" src="main.js"></script>
</body>
</html>
